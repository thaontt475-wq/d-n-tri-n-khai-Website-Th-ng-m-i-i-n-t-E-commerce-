global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Thu thập metrics từ ứng dụng Node.js E-Commerce
  - job_name: 'ecommerce-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ecommerce_app:3000']
        labels:
          app: 'ecommerce-backend'
          environment: 'production'

  # Thu thập metrics phần cứng & containers từ cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          role: 'container-monitoring'

  # Tự giám sát tiến trình Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
