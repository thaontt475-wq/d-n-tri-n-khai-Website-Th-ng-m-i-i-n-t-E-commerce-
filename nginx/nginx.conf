user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tắt thông tin phiên bản Nginx để bảo mật (Security Hardening)
    server_tokens off;

    # Định dạng Log JSON chuẩn hóa cho Loki & Promtail phân tích
    log_format json_analytics escape=json '{'
        '"time_local": "$time_local",'
        '"remote_addr": "$remote_addr",'
        '"remote_user": "$remote_user",'
        '"request_method": "$request_method",'
        '"request_uri": "$request_uri",'
        '"server_protocol": "$server_protocol",'
        '"status": $status,'
        '"body_bytes_sent": $body_bytes_sent,'
        '"request_time": $request_time,'
        '"upstream_response_time": "$upstream_response_time",'
        '"upstream_addr": "$upstream_addr",'
        '"http_referrer": "$http_referer",'
        '"http_user_agent": "$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Giới hạn kích thước body upload
    client_max_body_size 20M;

    # Gzip nén dữ liệu tăng tốc độ tải
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream định nghĩa backend
    upstream app_backend {
        server ecommerce_app:3000;
        keepalive 32;
    }

    upstream pma_backend {
        server ecommerce_phpmyadmin:80;
        keepalive 16;
    }

    # 1. Chuyển hướng toàn bộ HTTP (Port 80) -> HTTPS (Port 443)
    server {
        listen 80;
        listen [::]:80;
        server_name localhost 127.0.0.1;

        # Hardening header cho redirect
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Máy chủ HTTPS chính (Port 443) với SSL tự ký và Security Hardening
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost 127.0.0.1;

        # Cấu hình chứng chỉ SSL
        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        # Giao thức SSL & Ciphers an toàn
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ==========================================================
        # HTTP SECURITY HEADERS (BẢO MẬT HARDENING NGINX)
        # ==========================================================
        # HSTS (Bắt buộc HTTPS 1 năm)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Chống Clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Chống MIME-sniffing
        add_header X-Content-Type-Options "nosniff" always;
        # Bảo vệ Cross-site Scripting (XSS Filter)
        add_header X-XSS-Protection "1; mode=block" always;
        # Chính sách Referrer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Hạn chế quyền truy cập thiết bị phần cứng của trình duyệt
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Proxy tới Ứng dụng Node.js E-Commerce
        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Proxy tới phpMyAdmin để quản trị CSDL MySQL
        location /phpmyadmin/ {
            proxy_pass http://pma_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
