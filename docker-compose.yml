services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-supersecretroot}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_db}
      MYSQL_USER: ${DB_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend

  # 2. Ứng dụng Bán hàng Node.js (Web Frontend + RESTful API + Prometheus Metrics)
  app:
    build: ./app
    container_name: ecommerce_app
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_pass}
      DB_NAME: ${DB_NAME:-ecommerce_db}
    depends_on:
      - db
    networks:
      - frontend
      - backend
      - monitoring

  # 3. Nginx Reverse Proxy (HTTPS SSL tự ký, Security Hardening, JSON Logging)
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - phpmyadmin
    networks:
      - frontend

  # 4. phpMyAdmin (Quản trị trực quan Cơ sở dữ liệu MySQL qua giao diện Web)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ecommerce_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/phpmyadmin/
    depends_on:
      - db
    networks:
      - frontend
      - backend

  # 5. Prometheus (Hệ thống thu thập và lưu trữ time-series metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # 6. cAdvisor (Giám sát tài nguyên phần cứng, CPU, RAM, Network I/O của Container)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ecommerce_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring

  # 7. Grafana Loki (Lưu trữ và lập chỉ mục Log tập trung theo nhãn)
  loki:
    image: grafana/loki:latest
    container_name: ecommerce_loki
    restart: always
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  # 8. Promtail (Thu thập Log Nginx và App Docker containers gửi về Loki theo thời gian thực)
  promtail:
    image: grafana/promtail:latest
    container_name: ecommerce_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - monitoring

  # 9. Grafana Dashboard (Trực quan hóa đồ thị Metrics và LogQL tập trung)
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  db_data:
  nginx_logs:
  prometheus_data:
  loki_data:
  grafana_data:
